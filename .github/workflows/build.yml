name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Create Android project around index.html
        run: |
          test -f index.html || { echo "index.html missing in repo root"; exit 1; }
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'AURA_EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.aurapulse.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aurapulse.app"
                  minSdk = 24; targetSdk = 34
                  versionCode = 1; versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.media:media:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          AURA_EOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'AURA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="AuraPulse"
                  android:theme="@style/Theme.Aura"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AuraMediaService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          AURA_EOF
          mkdir -p "$(dirname app/src/main/java/com/aurapulse/app/AuraNative.kt)"
          cat > app/src/main/java/com/aurapulse/app/AuraNative.kt <<'AURA_EOF'
          // AuraNative.kt — real lock-screen player for AuraPulse (WebView APK). NOT tested on a device.
          // Package name: change to yours.
          package com.aurapulse.app

          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.os.*
          import android.provider.Settings
          import android.app.KeyguardManager
          import android.support.v4.media.MediaMetadataCompat
          import android.support.v4.media.session.MediaSessionCompat
          import android.support.v4.media.session.PlaybackStateCompat
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import androidx.media.app.NotificationCompat.MediaStyle

          object AuraMediaState {
              var title = ""; var artist = ""; var album = ""; var art: Bitmap? = null
              var playing = false; var pos = 0L; var dur = 0L
              var onAction: ((String) -> Unit)? = null   // set by MainActivity -> evaluateJavascript
          }

          class AuraBridge(private val act: Activity, private val web: WebView) {
              @JavascriptInterface fun updateMedia(t: String, a: String, al: String, artB64: String, playing: Boolean, posMs: Long, durMs: Long) {
                  val s = AuraMediaState
                  s.title = t; s.artist = a; s.album = al; s.playing = playing; s.pos = posMs; s.dur = durMs
                  if (artB64.isNotEmpty()) try { val b = Base64.decode(artB64, Base64.DEFAULT); s.art = BitmapFactory.decodeByteArray(b, 0, b.size) } catch (_: Exception) {}
                  val i = Intent(act, AuraMediaService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) act.startForegroundService(i) else act.startService(i)
              }
              @JavascriptInterface fun isLocked(): Boolean = (act.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager).isKeyguardLocked
              @JavascriptInterface fun setShowOnLock(on: Boolean) = act.runOnUiThread {
                  if (Build.VERSION.SDK_INT >= 27) { act.setShowWhenLocked(on); act.setTurnScreenOn(on) }
                  else {
                      val f = android.view.WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or android.view.WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      @Suppress("DEPRECATION") if (on) act.window.addFlags(f) else act.window.clearFlags(f)
                  }
              }
              @JavascriptInterface fun requestUnlock() = act.runOnUiThread {
                  if (Build.VERSION.SDK_INT >= 26) (act.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager).requestDismissKeyguard(act, null)
              }
              @JavascriptInterface fun openCast() = act.startActivity(Intent(Settings.ACTION_CAST_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              @JavascriptInterface fun openBluetoothSettings() = act.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              @JavascriptInterface fun openOutputSwitcher() = act.startActivity(Intent("android.settings.panel.action.MEDIA_OUTPUT").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              @JavascriptInterface fun exitApp() = act.finishAffinity()
          }

          class AuraMediaService : Service() {
              private lateinit var session: MediaSessionCompat
              private val CH = "aura_media"
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 26) (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                      .createNotificationChannel(NotificationChannel(CH, "Music playback", NotificationManager.IMPORTANCE_LOW).apply { lockscreenVisibility = Notification.VISIBILITY_PUBLIC })
                  session = MediaSessionCompat(this, "AuraPulse").apply {
                      setCallback(object : MediaSessionCompat.Callback() {
                          override fun onPlay() { AuraMediaState.onAction?.invoke("play") }
                          override fun onPause() { AuraMediaState.onAction?.invoke("pause") }
                          override fun onSkipToNext() { AuraMediaState.onAction?.invoke("next") }
                          override fun onSkipToPrevious() { AuraMediaState.onAction?.invoke("prev") }
                          override fun onSeekTo(p: Long) { AuraMediaState.onAction?.invoke("seek:$p") }
                      })
                      isActive = true
                  }
              }
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  when (i?.action) { "play","pause","next","prev" -> { AuraMediaState.onAction?.invoke(i.action!!) } }
                  val s = AuraMediaState
                  session.setMetadata(MediaMetadataCompat.Builder()
                      .putString(MediaMetadataCompat.METADATA_KEY_TITLE, s.title).putString(MediaMetadataCompat.METADATA_KEY_ARTIST, s.artist)
                      .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, s.album).putLong(MediaMetadataCompat.METADATA_KEY_DURATION, s.dur)
                      .putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, s.art).build())
                  session.setPlaybackState(PlaybackStateCompat.Builder()
                      .setActions(PlaybackStateCompat.ACTION_PLAY or PlaybackStateCompat.ACTION_PAUSE or PlaybackStateCompat.ACTION_PLAY_PAUSE or PlaybackStateCompat.ACTION_SKIP_TO_NEXT or PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS or PlaybackStateCompat.ACTION_SEEK_TO)
                      .setState(if (s.playing) PlaybackStateCompat.STATE_PLAYING else PlaybackStateCompat.STATE_PAUSED, s.pos, if (s.playing) 1f else 0f).build())
                  fun pi(a: String, c: Int) = PendingIntent.getService(this, c, Intent(this, AuraMediaService::class.java).setAction(a), PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val open = PendingIntent.getActivity(this, 0, packageManager.getLaunchIntentForPackage(packageName), PendingIntent.FLAG_IMMUTABLE)
                  val n = NotificationCompat.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_media_play).setContentTitle(s.title).setContentText(s.artist).setLargeIcon(s.art)
                      .setContentIntent(open).setVisibility(NotificationCompat.VISIBILITY_PUBLIC).setOnlyAlertOnce(true).setOngoing(s.playing)
                      .addAction(android.R.drawable.ic_media_previous, "Prev", pi("prev", 1))
                      .addAction(if (s.playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play, "Play/Pause", pi(if (s.playing) "pause" else "play", 2))
                      .addAction(android.R.drawable.ic_media_next, "Next", pi("next", 3))
                      .setStyle(MediaStyle().setMediaSession(session.sessionToken).setShowActionsInCompactView(0, 1, 2)).build()
                  ServiceCompat.startForeground(this, 77, n, if (Build.VERSION.SDK_INT >= 29) android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK else 0)
                  return START_NOT_STICKY
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onDestroy() { session.release(); super.onDestroy() }
          }

          /* ===== MainActivity: add these lines =====
             webView.settings.javaScriptEnabled = true
             webView.settings.mediaPlaybackRequiresUserGesture = false
             webView.addJavascriptInterface(AuraBridge(this, webView), "Android")
             AuraMediaState.onAction = { a -> runOnUiThread { webView.evaluateJavascript("window.auraNativeAction&&auraNativeAction('$a')", null) } }
             if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
             // Do NOT call webView.onPause() in onPause()/onStop() — it stops audio when the screen locks.
             // Keep android:hardwareAccelerated="true" on <application>.

             ===== AndroidManifest.xml =====
             <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
             <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
             <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
             <uses-permission android:name="android.permission.WAKE_LOCK"/>
             <service android:name=".AuraMediaService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
             (and on your <activity>: android:showWhenLocked="true" android:turnScreenOn="true" is optional; JS toggles it)

             ===== app/build.gradle =====
             implementation("androidx.media:media:1.7.0")
             implementation("androidx.core:core-ktx:1.13.1")
          */
          AURA_EOF
          mkdir -p "$(dirname app/src/main/java/com/aurapulse/app/MainActivity.kt)"
          cat > app/src/main/java/com/aurapulse/app/MainActivity.kt <<'AURA_EOF'
          package com.aurapulse.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.webkit.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView
              private var filePathCb: ValueCallback<Array<Uri>>? = null
              private val FILE_REQ = 41

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  web = WebView(this)
                  setContentView(web)

                  // Serve assets over https://appassets.androidplatform.net so localStorage / IndexedDB keep a stable origin.
                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false
                      allowContentAccess = true
                  }
                  web.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null)
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest) = loader.shouldInterceptRequest(r.url)
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          filePathCb?.onReceiveValue(null); filePathCb = cb
                          return try { startActivityForResult(p.createIntent(), FILE_REQ); true }
                          catch (e: Exception) { filePathCb = null; false }
                      }
                  }
                  web.addJavascriptInterface(AuraBridge(this, web), "Android")
                  AuraMediaState.onAction = { a -> runOnUiThread { web.evaluateJavascript("window.auraNativeAction&&auraNativeAction('$a')", null) } }

                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)

                  // Phone back button -> the player's own back handling (it calls Android.exitApp() at the root).
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() { web.evaluateJavascript("(typeof handleAuraBack==='function')?handleAuraBack():null", null) }
                  })

                  if (b == null) web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
              }

              @Deprecated("file chooser result")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  if (req == FILE_REQ) { filePathCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data)); filePathCb = null }
                  else super.onActivityResult(req, res, data)
              }
              // Intentionally NO web.onPause(): it would stop the music when the screen locks.
              override fun onDestroy() { AuraMediaState.onAction = null; super.onDestroy() }
          }
          AURA_EOF
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher_fg.xml)"
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'AURA_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF6B5E" android:pathData="M9,17.5a2.5,2.5 0,1 1,-1 -2V6l9,-2v10.5a2.5,2.5 0,1 1,-1 -2V8.2l-7,1.6z" android:translateX="3" android:translateY="3" android:scaleX="0.75" android:scaleY="0.75"/>
          </vector>
          AURA_EOF
          mkdir -p "$(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'AURA_EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          AURA_EOF
          mkdir -p "$(dirname app/src/main/res/values/themes.xml)"
          cat > app/src/main/res/values/themes.xml <<'AURA_EOF'
          <resources>
              <style name="Theme.Aura" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#1B1D24</item>
                  <item name="android:statusBarColor">#1B1D24</item>
                  <item name="android:navigationBarColor">#1B1D24</item>
              </style>
          </resources>
          AURA_EOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'AURA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          AURA_EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'AURA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          AURA_EOF
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'AURA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AuraPulse"
          include(":app")
          AURA_EOF
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuraPulse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
